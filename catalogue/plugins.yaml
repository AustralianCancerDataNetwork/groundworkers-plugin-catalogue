schema_version: 1

catalogue:
  id: groundworkers
  title: Groundworkers Plugin Catalogue
  description: Curated components that extend or support Groundworkers.
  target_groundworkers: 0.5.0
  target_python: ["3.12", "3.13"]

plugins:
  - id: groundworkers
    title: Groundworkers
    summary: MCP host for OMOP vocabulary, graph, embedding, and plugin capabilities.
    visibility: public
    kind: host
    status: released
    capabilities:
      - omop-vocabulary
      - concept-grounding
      - plugin-host
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundworkers.git
      slug: AustralianCancerDataNetwork/groundworkers
      access: public
    distribution:
      channel: pypi
      name: groundworkers
      version: 0.5.0
      install: uv add groundworkers==0.5.0
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: groundskeeping
    title: Groundskeeping
    summary: Reusable Textual operator shell, workbench, configuration browser, and telemetry primitives shared across host and plugin UIs.
    visibility: public
    kind: host
    status: released
    capabilities:
      - operator-shell
      - configuration-browser
      - telemetry-primitives
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundskeeping.git
      slug: AustralianCancerDataNetwork/groundskeeping
      access: public
    distribution:
      channel: pypi
      name: groundskeeping
      version: 0.8.1
      install: uv add groundskeeping==0.8.1
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: groundstore
    title: Groundstore
    summary: Shared mapping-task contracts and resumable persistence for Groundworkers-adjacent mapping workflows.
    visibility: public
    kind: host
    status: released
    capabilities:
      - mapping-task-contracts
      - mapping-persistence
      - decision-provenance
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundstore.git
      slug: AustralianCancerDataNetwork/groundstore
      access: public
    distribution:
      channel: pypi
      name: groundstore
      version: 0.1.0
      install: uv add groundstore==0.1.0
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: ohdsi-prompt-registry
    title: OHDSI Prompt Registry
    summary: Registry and MCP discovery surface for reviewed OHDSI prompt workflows.
    visibility: public
    kind: runtime-plugin
    status: released
    capabilities:
      - prompt-registry
      - mcp-prompts
      - json-schema-validation
    repository:
      url: https://github.com/AustralianCancerDataNetwork/ohdsi-prompt-registry.git
      slug: AustralianCancerDataNetwork/ohdsi-prompt-registry
      access: public
    distribution:
      channel: pypi
      name: ohdsi-prompt-registry
      version: 0.2.0
      install: uv add ohdsi-prompt-registry==0.2.0
    compatibility:
      groundworkers: ">=0.5,<0.6"
      python: ">=3.12,<3.14"
      test_profile: runtime-discovery
      matrix_enabled: false
      tested:
        - groundworkers: 0.5.0
          python: ["3.12", "3.13"]
          status: planned
      workflow: https://github.com/AustralianCancerDataNetwork/ohdsi-prompt-registry/actions
      workflow_file: compatibility.yml
    dependencies:
      - groundworkers

  - id: omop-concept-grounding
    title: OMOP Concept Grounding
    summary: Reviewed prompt workflow and schemas for verified OMOP concept grounding.
    visibility: private
    kind: prompt-pack
    status: planned
    capabilities:
      - concept-mapping
      - prompt-pack
      - structured-review
    repository:
      url: https://github.com/AustralianCancerDataNetwork/omop-concept-grounding.git
      slug: AustralianCancerDataNetwork/omop-concept-grounding
      access: private
    distribution:
      channel: pypi
      name: omop-concept-grounding
      version: 0.1.0
      install: uv add omop-concept-grounding==0.1.0
    compatibility:
      groundworkers: ">=0.5,<0.6"
      python: ">=3.12,<3.14"
      test_profile: prompt-pack-install
      matrix_enabled: false
      tested:
        - groundworkers: 0.5.0
          python: ["3.12", "3.13"]
          status: planned
      workflow: https://github.com/AustralianCancerDataNetwork/omop-concept-grounding/actions
      workflow_file: compatibility.yml
    dependencies:
      - ohdsi-prompt-registry

  - id: comparator-recommender
    title: Comparator Recommender
    summary: Recommends pairwise comparator cohorts from a prepared catalogue.
    visibility: private
    kind: runtime-plugin
