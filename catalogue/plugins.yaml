schema_version: 1

catalogue:
  id: groundworkers
  title: Groundworkers Plugin Catalogue
  description: Curated components that extend or support Groundworkers.
  target_groundworkers: 0.10.0
  target_python: ["3.12", "3.13"]

plugins:
  - id: groundworkers
    title: Groundworkers
    summary: MCP host for OMOP vocabulary, graph, embedding, and plugin capabilities.
    visibility: public
    kind: host
    status: released
    capabilities:
      - omop-vocabulary
      - concept-grounding
      - plugin-host
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundworkers.git
      slug: AustralianCancerDataNetwork/groundworkers
      access: public
    distribution:
      channel: pypi
      name: groundworkers
      version: 0.10.0
      install: uv add groundworkers==0.10.0
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: groundskeeping
    title: Groundskeeping
    summary: Reusable Textual operator shell, workbench, configuration browser, and telemetry primitives shared across host and plugin UIs.
    visibility: public
    kind: host
    status: released
    capabilities:
      - operator-shell
      - configuration-browser
      - telemetry-primitives
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundskeeping.git
      slug: AustralianCancerDataNetwork/groundskeeping
      access: public
    distribution:
      channel: pypi
      name: groundskeeping
      version: 0.9.1
      install: uv add groundskeeping==0.9.1
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: groundstore
    title: Groundstore
    summary: Shared mapping-task contracts and resumable persistence for Groundworkers-adjacent mapping workflows.
    visibility: public
    kind: host
    status: released
    capabilities:
      - mapping-task-contracts
      - mapping-persistence
      - decision-provenance
    repository:
      url: https://github.com/AustralianCancerDataNetwork/groundstore.git
      slug: AustralianCancerDataNetwork/groundstore
      access: public
    distribution:
      channel: pypi
      name: groundstore
      version: 0.5.0
      install: uv add groundstore==0.5.0
    compatibility:
      groundworkers: null
      python: ">=3.12,<3.14"
      test_profile: host
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies: []

  - id: ohdsi-prompt-registry
    title: OHDSI Prompt Registry
    summary: Registry and MCP discovery surface for reviewed OHDSI prompt workflows.
    visibility: public
    kind: runtime-plugin
    status: released
    capabilities:
      - prompt-registry
      - mcp-prompts
      - json-schema-validation
    repository:
      url: https://github.com/AustralianCancerDataNetwork/ohdsi-prompt-registry.git
      slug: AustralianCancerDataNetwork/ohdsi-prompt-registry
      access: public
    distribution:
      channel: pypi
      name: ohdsi-prompt-registry
      version: 0.5.0
      install: uv add ohdsi-prompt-registry==0.5.0
    compatibility:
      groundworkers: ">=0.7.1,<1.0"
      python: ">=3.12,<3.14"
      test_profile: runtime-discovery
      matrix_enabled: true
      tested:
        - groundworkers: 0.10.0
          python: ["3.12", "3.13"]
          status: planned
      workflow: https://github.com/AustralianCancerDataNetwork/ohdsi-prompt-registry/actions
      workflow_file: compatibility.yml
    dependencies:
      - groundworkers

  - id: circe-cohort-check
    title: Circe Cohort Definition Check
    summary: Read-only Circe cohort validation, Markdown rendering, SQL text generation, and phenotype-shape classification via OHDSI Circepy.
    visibility: private
    kind: runtime-plugin
    status: planned
    capabilities:
      - cohort-validation
      - cohort-rendering
      - cohort-sql-generation
      - phenotype-shapes
    repository:
      url: https://github.com/AustralianCancerDataNetwork/circe-cohort-check.git
      slug: AustralianCancerDataNetwork/circe-cohort-check
      access: private
    distribution:
      channel: git
      name: circe-cohort-check
      version: 0.1.0
      install: Access on request
    compatibility:
      groundworkers: ">=0.7,<1"
      python: ">=3.12"
      test_profile: runtime-discovery
      matrix_enabled: false
      tested: []
      workflow: null
      workflow_file: null
    dependencies:
      - groundworkers
      - oa-configurator
      - pydantic
      - ohdsi-circepy

  - id: omop-concept-grounding
    title: OMOP Concept Grounding
    summary: Reviewed prompt workflow and schemas for verified OMOP concept grounding.
    visibility: public
    kind: prompt-pack
    status: released
