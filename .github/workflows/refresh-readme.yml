name: Refresh catalogue README

on:
  push:
    branches: [main]
    paths:
      - catalogue/**
      - scripts/**
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run python scripts/validate_catalogue.py
      - run: uv run python scripts/validate_catalogue.py --write-readme
      - name: Commit generated catalogue views
        run: |
          if git diff --quiet -- README.md dist; then
            echo "Generated catalogue views are already current."
            exit 0
          fi
          git config user.name "groundworkers-catalogue[bot]"
          git config user.email "groundworkers-catalogue[bot]@users.noreply.github.com"
          git add README.md dist
          git commit -m "chore: refresh catalogue views [skip ci]"
          git push
