[project]
name = "groundworkers-plugin-catalogue"
version = "0.1.0"
description = "Catalogue and compatibility metadata for Groundworkers plugins."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4,<5",
  "pytest>=9,<10",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
